<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة | Health Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #164d85;
      --primary-dark: #0d365f;
      --secondary: #e53935;
      --secondary-dark: #c62828;
      --soft-blue: #ebf8ff;
      --soft-bg: #f4fbff;
      --white: #ffffff;
      --text: #173b63;
      --muted: #55789b;
      --border: #d7ebf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Cairo", sans-serif;
      background: var(--soft-bg);
      color: var(--text);
      direction: rtl;
      line-height: 1.8;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 18px;
      padding: 34px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .login-box h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--primary);
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-family: "Cairo", sans-serif;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 77, 133, 0.08);
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .login-btn,
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-family: "Cairo", sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      font-size: 16px;
      margin-top: 10px;
    }

    .login-btn:hover { transform: translateY(-2px); }

    .error {
      color: var(--secondary);
      font-weight: 700;
      text-align: center;
      margin-top: 12px;
      min-height: 22px;
    }

    .admin-panel {
      display: none;
      max-width: 1300px;
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 20px 24px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topbar h2 {
      color: var(--primary);
      font-size: 24px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .logout-btn {
      background: var(--secondary);
      color: var(--white);
      padding: 12px 20px;
    }

    .logout-btn:hover {
      background: var(--secondary-dark);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: #eef3ff;
      border-color: #bad0ff;
    }

    .panel {
      display: none;
      background: var(--white);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-radius: 16px;
      padding: 26px;
    }

    .panel.active { display: block; }

    .panel h3 {
      color: var(--primary);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid .full {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-danger {
      background: var(--secondary);
      color: var(--white);
    }

    .btn-danger:hover {
      background: var(--secondary-dark);
    }

    .btn-secondary {
      background: #edf1f5;
      color: var(--text);
    }

    .btn-success {
      background: #20b26b;
      color: var(--white);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      text-align: right;
      padding: 12px 10px;
      border-bottom: 1px solid #eff3f8;
      vertical-align: top;
    }

    th {
      background: #f4f8ff;
      color: var(--primary);
      font-weight: 700;
    }

    img.product-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
    }

    .mini-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-actions .btn {
      font-size: 12px;
      padding: 8px 12px;
    }

    .toast {
      display: none;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .toast.show {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: 18px;
      padding: 24px;
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .topbar-actions {
        flex-direction: column;
        width: 100%;
      }
      .topbar-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <div class="login-container" id="loginWrap">
    <div class="login-box">
      <h1>لوحة الإدارة</h1>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input id="adminUsername" type="text" placeholder="admin" />
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input id="adminPassword" type="password" placeholder="أدخل كلمة المرور" />
      </div>
      <button class="btn login-btn" onclick="loginAdmin()">دخول</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="adminPanel">
    <div class="topbar">
      <h2>Health Care | إدارة المنتجات</h2>
      <div class="topbar-actions">
        <button class="btn btn-secondary" onclick="changePassword()">تغيير كلمة المرور</button>
        <button class="btn logout-btn" onclick="logoutAdmin()">تسجيل الخروج</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="add">➕ إضافة منتج</button>
      <button class="tab-btn" data-tab="manage">📋 إدارة المنتجات</button>
      <button class="tab-btn" data-tab="backup">💾 نسخ احتياطي</button>
    </div>

    <!-- ADD PRODUCT TAB -->
    <div id="addPanel" class="panel active">
      <h3>إضافة منتج جديد</h3>
      <form id="addProductForm">
        <div class="grid">
          <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="productName" required />
          </div>

          <div class="form-group">
            <label>السعر</label>
            <input type="number" id="productPrice" min="0" required />
          </div>

          <div class="form-group">
            <label>الفئة</label>
            <select id="productCategory" required>
              <option value="">اختر الفئة</option>
              <option value="health">الرعاية الصحية</option>
              <option value="science">الكليات العلمية</option>
              <option value="laboratory">معامل التحاليل الطبية</option>
            </select>
          </div>

          <div class="form-group">
            <label>رمز المنتج</label>
            <input type="text" id="productIcon" maxlength="2" required />
          </div>

          <div class="form-group full">
            <label>الوصف</label>
            <textarea id="productDescription" required></textarea>
          </div>

          <div class="form-group full">
            <label>رابط الصورة</label>
            <input type="url" id="productImage" required />
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" onclick="resetAddForm()">مسح</button>
          <button type="submit" class="btn btn-primary">إضافة المنتج</button>
        </div>
      </form>
    </div>

    <!-- MANAGE PRODUCTS TAB -->
    <div id="managePanel" class="panel">
      <h3>إدارة المنتجات</h3>
      <div id="productsTableContainer"></div>
    </div>

    <!-- BACKUP TAB -->
    <div id="backupPanel" class="panel">
      <h3>النسخ الاحتياطي</h3>
      <div class="actions">
        <button class="btn btn-success" onclick="exportProducts()">📥 تصدير JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importInput').click()">📤 استيراد JSON</button>
        <button class="btn btn-danger" onclick="resetToDefaultProducts()">🔄 إعادة تعيين</button>
      </div>
      <input type="file" id="importInput" style="display:none" accept=".json" onchange="importProducts(event)" />
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>تعديل المنتج</h3>
      <form id="editProductForm">
        <input type="hidden" id="editProductId" />

        <div class="form-group">
          <label>اسم المنتج</label>
          <input type="text" id="editProductName" required />
        </div>

        <div class="form-group">
          <label>السعر</label>
          <input type="number" id="editProductPrice" min="0" required />
        </div>

        <div class="form-group">
          <label>الوصف</label>
          <textarea id="editProductDescription" required></textarea>
        </div>

        <div class="form-group">
          <label>رمز المنتج</label>
          <input type="text" id="editProductIcon" maxlength="2" required />
        </div>

        <div class="form-group">
          <label>رابط الصورة</label>
          <input type="url" id="editProductImage" required />
        </div>

        <div class="actions">
          <button type="button" class="btn btn-danger" onclick="deleteFromModal()">🗑️ حذف المنتج</button>
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
        </div>
      </form>
    </div>
  </div>

 <script src="admin.js?v=2"></script>
</body>
</html>
