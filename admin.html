
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم Health Care</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f8fc;color:#173b63}
header{background:linear-gradient(120deg,#164d85,#2387b9);color:white;padding:22px;text-align:center}
header h1{margin:0 0 8px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:20px;box-shadow:0 4px 18px #164d8512}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbdfea;border-radius:8px;font-size:15px}
label{font-weight:bold}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold;margin:3px}
.primary{background:#164d85;color:white}
.danger{background:#e53935;color:white}
.secondary{background:#e8f4fb;color:#164d85}
.green{background:#16865a;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px;border-bottom:1px solid #e4edf3;text-align:right}
th{background:#eaf5fc}
img.thumb{width:55px;height:55px;object-fit:cover;border-radius:7px}
.table-wrap{overflow-x:auto}
.hidden{display:none!important}
.notice{padding:12px;background:#eaf7ef;border-radius:8px;margin-bottom:12px}
.error{color:#d52222;margin:10px 0}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
h2{color:#164d85}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}}
</style>
</head>
<body>

<header>
  <h1>Health Care</h1>
  <div>لوحة التحكم وإدارة المنتجات</div>
</header>

<div class="container">

  <section class="card" id="loginBox">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <label for="username">اسم المستخدم</label>
      <input id="username" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">دخول</button>
      <p class="error" id="loginError"></p>
    </form>
  </section>

  <main id="dashboard" class="hidden">
    <div class="card">
      <h2>إدارة المتجر</h2>
      <div class="top-actions">
        <button class="secondary" id="exportBtn">تصدير نسخة احتياطية</button>
        <button class="secondary" id="importBtn">استيراد نسخة احتياطية</button>
        <button class="danger" id="logoutBtn">تسجيل الخروج</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hidden">
      <p id="status" class="notice">يمكنك إضافة المنتجات وتعديلها وحذفها.</p>
    </div>

    <section class="card">
      <h2 id="formTitle">إضافة منتج جديد</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="grid">
          <div>
            <label for="name">اسم المنتج</label>
            <input id="name" required>
          </div>
          <div>
            <label for="price">السعر بالجنيه</label>
            <input id="price" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label for="category">القسم</label>
            <select id="category" required>
              <option value="health">الرعاية الصحية</option>
              <option value="science">مستلزمات الكليات العلمية</option>
              <option value="laboratory">مستلزمات معامل التحاليل الطبية</option>
            </select>
          </div>
          <div>
            <label for="icon">رمز المنتج (اختياري)</label>
            <input id="icon" placeholder="🔬">
          </div>
          <div class="full">
            <label for="description">وصف المنتج</label>
            <textarea id="description" rows="3"></textarea>
          </div>
          <div class="full">
            <label for="image">رابط صورة المنتج</label>
            <input id="image" type="url" placeholder="https://example.com/image.jpg">
          </div>
        </div>
        <button class="primary" type="submit" id="saveBtn">إضافة المنتج</button>
        <button class="secondary" type="button" id="cancelBtn">إلغاء التعديل</button>
      </form>
    </section>

    <section class="card">
      <h2>المنتجات الحالية</h2>
      <label for="filter">عرض قسم محدد</label>
      <select id="filter">
        <option value="all">كل الأقسام</option>
        <option value="health">الرعاية الصحية</option>
        <option value="science">الكليات العلمية</option>
        <option value="laboratory">معامل التحاليل الطبية</option>
      </select>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الصورة</th>
              <th>المنتج</th>
              <th>القسم</th>
              <th>السعر</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="productsList"></tbody>
        </table>
      </div>
      <p id="emptyMessage" class="hidden">لا توجد منتجات في هذا القسم.</p>
    </section>
  </main>
</div>

<script>
"use strict";

const USERNAME = "admin";
const PASSWORD = "healthcare";
const STORAGE_KEY = "healthCareProducts";

const categoryNames = {
  health: "الرعاية الصحية",
  science: "الكليات العلمية",
  laboratory: "معامل التحاليل الطبية"
};

const initialProducts = {
  health: [
    {id:1,name:"كمادات حرارية",price:45,icon:"🧊",image:"https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=400&q=80",description:"كمادات للاستخدام المنزلي",category:"health"},
    {id:2,name:"مقياس ضغط",price:180,icon:"🩺",image:"https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=400&q=80",description:"قياس الضغط المنزلي",category:"health"}
  ],
  science: [
    {id:5,name:"مجهر صغير",price:220,icon:"🔬",image:"https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=400&q=80",description:"للمختبرات التعليمية",category:"science"}
  ],
  laboratory: [
    {id:9,name:"قمع زجاجي",price:70,icon:"🧫",image:"https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=400&q=80",description:"أداة للمختبرات الطبية",category:"laboratory"}
  ]
};

const $ = id => document.getElementById(id);

function readProducts() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initialProducts));
      return structuredClone(initialProducts);
    }

    const data = JSON.parse(saved);
    if (!data || typeof data !== "object" || Array.isArray(data)) {
      throw new Error("Invalid product data");
    }

    for (const key of Object.keys(categoryNames)) {
      if (!Array.isArray(data[key])) data[key] = [];
    }
    return data;
  } catch (error) {
    alert("تعذر قراءة المنتجات. احتفظي بنسخة احتياطية قبل أي تعديل.");
    return {health:[],science:[],laboratory:[]};
  }
}

function saveProducts(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (error) {
    alert("تعذر حفظ البيانات في المتصفح.");
    return false;
  }
}

function allProducts(data) {
  return Object.values(data).flat();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function showStatus(message) {
  $("status").textContent = message;
}

function renderProducts() {
  const data = readProducts();
  const filter = $("filter").value;
  const products = allProducts(data).filter(product =>
    filter === "all" || product.category === filter
  );

  $("productsList").innerHTML = products.map(product => `
    <tr>
      <td>${product.image ? `<img class="thumb" src="${escapeHTML(product.image)}" alt="">` : "—"}</td>
      <td>${escapeHTML(product.name)}</td>
      <td>${escapeHTML(categoryNames[product.category] || product.category)}</td>
      <td>${escapeHTML(product.price)} ج.م</td>
      <td>
        <button class="primary" data-edit="${Number(product.id)}">تعديل</button>
        <button class="danger" data-delete="${Number(product.id)}">حذف</button>
      </td>
    </tr>
  `).join("");

  $("emptyMessage").classList.toggle("hidden", products.length > 0);
}

$("loginForm").addEventListener("submit", event => {
  event.preventDefault();

  if ($("username").value.trim() === USERNAME &&
      $("password").value === PASSWORD) {
    $("loginBox").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("loginError").textContent = "";
    renderProducts();
  } else {
    $("loginError").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
  }
});

$("logoutBtn").addEventListener("click", () => {
  $("dashboard").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("password").value = "";
});

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  $("formTitle").textContent = "إضافة منتج جديد";
  $("saveBtn").textContent = "إضافة المنتج";
}

$("cancelBtn").addEventListener("click", resetForm);
$("filter").addEventListener("change", renderProducts);

$("productForm").addEventListener("submit", event => {
  event.preventDefault();

  const data = readProducts();
  const id = $("productId").value;
  const category = $("category").value;
  const product = {
    id: id ? Number(id) : Date.now(),
    name: $("name").value.trim(),
    price: Number($("price").value),
    category,
    icon: $("icon").value.trim() || "📦",
    description: $("description").value.trim(),
    image: $("image").value.trim()
  };

  if (!product.name || !Number.isFinite(product.price) || product.price < 0) {
    showStatus("راجعي اسم المنتج والسعر.");
    return;
  }

  if (id) {
    let found = false;
    for (const key of Object.keys(categoryNames)) {
      data[key] = data[key].filter(item => {
        if (Number(item.id) === Number(id)) {
          found = true;
          return false;
        }
        return true;
      });
    }
    if (!found) {
      showStatus("لم يتم العثور على المنتج.");
      return;
    }
  }

  data[category].push(product);

  if (saveProducts(data)) {
    resetForm();
    renderProducts();
    showStatus(id ? "تم تحديث المنتج محليًا." : "تمت إضافة المنتج محليًا.");
  }
});

$("productsList").addEventListener("click", event => {
  const editButton = event.target.closest("[data-edit]");
  const deleteButton = event.target.closest("[data-delete]");
  if (!editButton && !deleteButton) return;

  const id = Number((editButton || deleteButton).dataset[
    editButton ? "edit" : "delete"
  ]);
  const data = readProducts();
  const product = allProducts(data).find(item => Number(item.id) === id);
  if (!product) return;

  if (editButton) {
    $("productId").value = product.id;
    $("name").value = product.name || "";
    $("price").value = product.price;
    $("category").value = product.category;
    $("icon").value = product.icon || "";
    $("description").value = product.description || "";
    $("image").value = product.image || "";
    $("formTitle").textContent = "تعديل المنتج";
    $("saveBtn").textContent = "حفظ التعديلات";
    window.scrollTo({top:0,behavior:"smooth"});
  }

  if (deleteButton && confirm("هل تريدين حذف المنتج: " + product.name + "؟")) {
    for (const key of Object.keys(categoryNames)) {
      data[key] = data[key].filter(item => Number(item.id) !== id);
    }
    if (saveProducts(data)) {
      renderProducts();
      showStatus("تم حذف المنتج محليًا.");
    }
  }
});

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob(
    [JSON.stringify(readProducts(), null, 2)],
    {type:"application/json"}
  );
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "health-care-products.json";
  link.click();
  URL.revokeObjectURL(url);
});

$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());
    for (const key of Object.keys(categoryNames)) {
      if (!Array.isArray(data[key])) {
        throw new Error("Invalid category");
      }
    }
    if (saveProducts(data)) {
      renderProducts();
      showStatus("تم استيراد المنتجات محليًا.");
    }
  } catch {
    alert("الملف غير صالح أو لا يحتوي على الأقسام المطلوبة.");
  }
  event.target.value = "";
});
</script>
</body>
</html>
